{% extends 'nuevos/index.html' %}
{% block cliente_creacion %}
<div class="col">
                <div class="row row-cards">
                  <div class="col-12 col-lg-6">
                    <div class="card">
                      <div class="card-header">
                        <h3 class="card-title">Información del cliente</h3>
                      </div>
                      <div class="card-body">
                        <form method="post" class="space-y">
                            {% csrf_token %}
                            <div class="col">
                                <label class="form-label"> Nombre </label>
                              {{ form.nombre }}
                            </div>
                            <div class="col">
                                <label class="form-label"> Apellido </label>

                              {{ form.apellido }}
                            </div>
                          <div class="text-end">
                              <a href="{% url 'lista_clientes' %}" class="btn btn-1"> Cancel </a>
                              <button type="submit" class="btn btn-primary btn-2"> Guardar cambios </button>
                            </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
{% endblock cliente_creacion %}
