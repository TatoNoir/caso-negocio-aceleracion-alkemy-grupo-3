{% extends 'nuevos/index.html' %}
{% block servicio_creacion %}
<div class="col">
                <div class="row row-cards">
                  <div class="col-12 col-lg-6">
                    <div class="card">
                      <div class="card-header">
                        <h3 class="card-title">Información del servicio</h3>
                      </div>
                      <div class="card-body">
                        <form method="post" class="space-y">
                            {% csrf_token %}
                            <div class="col">
                                <label class="form-label"> Nombre </label>
                              {{ form.nombre }}
                            </div>
                            <div class="col">
                                <label class="form-label"> Descripcion </label>
                              {{ form.descripcion }}
                            </div>
                            <div class="col">
                                <label class="form-label"> Precio </label>
                              {{ form.precio }}
                            </div>
                          <div class="text-end">
                              <a href="{% url 'listar_servicios' %}" class="btn btn-1"> Cancel </a>
                              <button type="submit" class="btn btn-primary btn-2"> Guardar cambios </button>
                            </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
{% endblock servicio_creacion %}
