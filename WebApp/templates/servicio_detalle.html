{% extends 'base.html' %}

{% block servicio_detalle2 %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="mb-4">Editar servicio</h1>

            <form method="post" class="card p-4 shadow-sm">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        Guardar
                    </button>

                    <a href="{% url 'listar_servicios' %}" class="btn btn-secondary ms-2">
                        Cancelar
                    </a>
                    <button type="button" class="btn btn-danger ms-2" data-bs-toggle="modal"
                        data-bs-target="#confirmarEliminarModal">
                        Eliminar
                    </button>
                </div>

            </form>
        </div>
    </div>

</div>
<!-- Modal oculto para confirmar la eliminacion de un servicio.-->
<div class="modal fade" id="confirmarEliminarModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalLabel">Confirmar eliminación</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                ¿Estás seguro de que deseas eliminar el servicio <strong>"{{ servicio.nombre }}"</strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>

                <!-- Formulario POST que envía la orden directamente a DeleteView -->
                <form method="post" action="{% url 'eliminar_servicio' pk=servicio.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock servicio_detalle2 %}
