<div class="col-12">
  <div class="card">
    <div class="card-body">
      <!-- Contenedor donde FullCalendar renderizará la grilla -->
      <div id="calendar-reservas"></div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar-reservas');

  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    locale: 'es',
    // FullCalendar adjuntará ?start=YYYY-MM-DD&end=YYYY-MM-DD a esta URL en cada cambio de mes/semana
    events: "{% url 'api_reservas_calendar' %}",
  });

  calendar.render();
});
</script>
