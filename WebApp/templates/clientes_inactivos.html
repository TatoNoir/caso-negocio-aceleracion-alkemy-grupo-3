{% extends 'base.html' %}

{% block content_inactive %}

<div>

    <h1>Clientes</h1>

    {% if clientes %}
        <div class="row g-4">
            <ul class="list-group m-3">
                {% for cliente in clientes %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>
                        {{ cliente.nombre }} {{ cliente.apellido }}
                    </span>

                    <div class="d-flex gap-2 flex-shrink-0">

                        <form method="post" action="{% url 'restaurar_cliente' cliente.pk %}">
                            {% csrf_token %}

                            <button type="submit" class="btn btn-success">
                                Restaurar
                            </button>
                        </form>

                    </div>

                </li>
                {% endfor %}
            </ul>
        </div>
    {% else %}
        <p>
            No hay clientes activos.
        </p>
    {% endif %}

    <a href="{% url 'lista_clientes' %}" class="btn btn-secondary ms-2">
        Cancelar
    </a>
</div>

{% endblock %}
